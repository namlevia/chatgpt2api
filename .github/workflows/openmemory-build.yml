name: Build openmemory

# Build image OpenMemory (CaviraOSS/OpenMemory) → ghcr của mình, server chỉ
# pull về chạy (giống captcha-solver) — không build từ source trên server.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openmemory-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openmemory
  # Pin ref upstream — đổi ref ở đây khi muốn lên version mới
  OPENMEMORY_REF: main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout upstream OpenMemory
        uses: actions/checkout@v4
        with:
          repository: CaviraOSS/OpenMemory
          ref: ${{ env.OPENMEMORY_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./packages/openmemory-js
          file: ./packages/openmemory-js/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
